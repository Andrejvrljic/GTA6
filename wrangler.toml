name = "gta6"
main = "cloudflare/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Das Spiel selbst (HTML, JavaScript, 3D-Engine, geteilte Simulation)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Multiplayer-Raum über WebSocket (alle Spieler gemeinsam)
[[durable_objects.bindings]]
name = "ARENA"
class_name = "ArenaDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArenaDO"]

# Konten, Geld, Position. database_id trägt der GitHub-Actions-Workflow automatisch ein.
[[d1_databases]]
binding = "DB"
database_name = "gta6-db"
database_id = "__D1_DATABASE_ID__"
