<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Night City</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud">
    <div id="minimap"><canvas id="minimapCanvas" width="160" height="160"></canvas></div>
    <div id="bars">
      <div class="bar"><div class="barLabel">Leben</div><div class="barTrack"><div id="healthFill" class="barFill health"></div></div></div>
      <div class="bar"><div class="barLabel">Ausdauer</div><div class="barTrack"><div id="staminaFill" class="barFill stamina"></div></div></div>
    </div>
    <div id="money">💰 <span id="moneyValue">0</span> $</div>
    <div id="speed" class="hidden">🚗 <span id="speedValue">0</span> km/h</div>
    <div id="hint">WASD bewegen · Shift sprinten · Strg hocken · Leertaste springen · E Fahrzeug ein/aus · Maus ziehen = Kamera</div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
